<template name="nav">
  <nav id="Nav" aria-label="Main">
    <a class="wordmark" href="/">{{studio.name}}<small>{{studio.suffix}}</small></a>
    <ul>
      {{#each link in nav}}
        <li><a class="navLink" href="{{link.href}}">{{link.label}}</a></li>
      {{/each}}
    </ul>
  </nav>
</template>
