    # by-design.dev: the studio site (github.com/Ganakim/By-Design), a Meteor app in D:\By Design on 127.0.0.1:8092
    # (deploy/setup.ps1). www and plain http are sent to https://by-design.dev; the wildcard certificate names the bare
    # domain too. Without these blocks the bare domain fell through to the first 443 block (classroom's).
    server {
        listen 80;
        server_name by-design.dev www.by-design.dev;
        server_tokens off;
        return 301 https://by-design.dev$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.by-design.dev;
        server_tokens off;

        ssl_certificate     "C:\Users\Server\AppData\Local\Posh-ACME\LE_PROD\2296076346\wildcard\fullchain.cer";
        ssl_certificate_key "C:\Users\Server\AppData\Local\Posh-ACME\LE_PROD\2296076346\wildcard\cert.key";

        return 301 https://by-design.dev$request_uri;
    }

    server {
        listen 443 ssl;
        server_name by-design.dev;
        server_tokens off;

        ssl_certificate     "C:\Users\Server\AppData\Local\Posh-ACME\LE_PROD\2296076346\wildcard\fullchain.cer";
        ssl_certificate_key "C:\Users\Server\AppData\Local\Posh-ACME\LE_PROD\2296076346\wildcard\cert.key";

        # nothing is ever posted to it
        client_max_body_size 64k;

        location / {
            proxy_pass          http://127.0.0.1:8092;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto https;
            # meteor's socket to the browser (/sockjs), upgraded; $connection_upgrade is the map already at the top
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
        }
    }
